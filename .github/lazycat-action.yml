version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/domain-admin.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: domain-admin

build:
  run_buildscript: false

images:
  # 主应用：上游有完整三段 v 前缀 SemVer tag（最高 v1.6.78），排除 latest/v/v-s 等别名
  - id: domain-admin
    target: service
    service: domain-admin
    source: mouday/domain-admin
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Domain Admin
    summary: "域名和SSL证书监测平台"
